<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Release Configuration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-100 text-gray-800">

    <nav class="bg-white shadow-md">
        <div class="container mx-auto max-w-5xl px-4">
            <div class="flex justify-between items-center py-4">
                <div class="text-2xl font-bold text-gray-800">Release Notes Service</div>
                <div class="flex space-x-4">
                    <a href="/" class="text-gray-600 hover:text-blue-600 font-semibold">Dashboard</a>
                    <a href="/" class="text-gray-600 hover:text-blue-600 font-semibold" onclick="event.preventDefault(); window.location.href='/'+'#settings'">Settings</a>
                </div>
            </div>
        </div>
    </nav>

    <main id="app-container" class="container mx-auto max-w-5xl my-8 px-4">
        <!-- Pages will be rendered here by JavaScript -->
    </main>

    <!-- Page Templates -->
    <template id="release-form-template">
        <div data-page="release-form" class="bg-white rounded-xl shadow-lg p-6 md:p-8">
            <h1 class="text-3xl font-bold mb-6" id="form-title">Create New Release</h1>
            <form id="release-form" class="space-y-6">
                <input type="hidden" id="release-id">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="version" class="block text-sm font-medium text-gray-600 mb-1">Version</label>
                        <input type="text" id="version" class="w-full p-2 border border-gray-300 rounded-md" placeholder="e.g., 2.8.1" required>
                    </div>
                    <div>
                        <label for="project" class="block text-sm font-medium text-gray-600 mb-1">Project</label>
                        <select id="project" class="w-full p-2 border border-gray-300 rounded-md" required>
                            <option value="PSMDB">PSMDB</option>
                            <option value="PBM">PBM</option>
                            <option value="PLM">PLM</option>
                            <option value="K8SPSMDB">K8SPSMDB</option>
                            <option value="K8SPS">K8SPS</option>
                            <option value="K8SPXC">K8SPXC</option>
                            <option value="P8SPG">P8SPG</option>
                        </select>
                    </div>
                </div>
                <!-- Introduction Template selector and editable Introduction -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="introTemplate" class="block text-sm font-medium text-gray-600 mb-1">Introduction Template</label>
                        <select id="introTemplate" class="w-full p-2 border border-gray-300 rounded-md">
                            <option value="PSMDB">PSMDB</option>
                            <option value="PBM">PBM</option>
                            <option value="PLM">PLM</option>
                            <option value="K8SPSMDB">K8SPSMDB</option>
                            <option value="K8SPS">K8SPS</option>
                            <option value="K8SPXC">K8SPXC</option>
                            <option value="P8SPG">P8SPG</option>
                        </select>
                    </div>
                    <div class="md:col-span-1"></div>
                </div>
                
                <div>
                    <label for="customIntroduction" class="block text-sm font-medium text-gray-600 mb-1">Introduction (editable)</label>
                    <textarea id="customIntroduction" class="w-full p-2 border border-gray-300 rounded-md h-32" placeholder="Will be auto-generated for PSMDB based on Upstream Release URLs and Version. Type here to override."></textarea>
                    <p class="text-xs text-gray-500 mt-1">Selecting PBM or PLM will prefill this field. You may edit it.</p>
                </div>
                <div>
                    <label for="plannedDate" class="block text-sm font-medium text-gray-600 mb-1">Planned Release Date</label>
                    <input type="date" id="plannedDate" class="w-full p-2 border border-gray-300 rounded-md" required>
                </div>
                <div>
                    <label for="releaseHighlights" class="block text-sm font-medium text-gray-600 mb-1">Release Highlights (Markdown)</label>
                    <textarea id="releaseHighlights" class="w-full p-2 border border-gray-300 rounded-md h-40" placeholder="### New Feature&#10;Description of the new feature..."></textarea>
                </div>
                <div>
                    <label for="jiraReleaseId" class="block text-sm font-medium text-gray-600 mb-1">JIRA Release ID</label>
                    <input type="text" id="jiraReleaseId" class="w-full p-2 border border-gray-300 rounded-md" placeholder="e.g., PSMDB 8.0.5">
                    <p class="text-xs text-gray-500 mt-1">The 'Fix Version' ID from JIRA. All tickets with this version will be included.</p>
                </div>
                <div>
                    <label for="additionalJiraTickets" class="block text-sm font-medium text-gray-600 mb-1">Additional JIRA Ticket Keys</label>
                    <textarea id="additionalJiraTickets" class="w-full p-2 border border-gray-300 rounded-md h-24" placeholder="PSMDB-123, PSMDB-456"></textarea>
                </div>
                <div>
                    <label for="upstreamUrls" class="block text-sm font-medium text-gray-600 mb-1">Upstream Release URLs (PSMDB only)</label>
                    <textarea id="upstreamUrls" class="w-full p-2 border border-gray-300 rounded-md h-24" placeholder="https://www.mongodb.com/docs/manual/release-notes/8.0/..."></textarea>
                </div>
                <!-- Upstream Bug Fix URLs Field -->
                <div>
                    <label for="upstreamBugUrls" class="block text-sm font-medium text-gray-600 mb-1">Upstream Bug Fix URLs (MongoDB JIRA)</label>
                    <textarea id="upstreamBugUrls" class="w-full p-2 border border-gray-300 rounded-md h-24" placeholder="https://jira.mongodb.org/browse/SERVER-12345"></textarea>
                </div>
                <!-- Percona Certified Images Section (Operators only) -->
                <div id="certified-images-section" class="space-y-6 border-t border-gray-200 pt-6 hidden">
                    <h3 class="text-lg font-semibold text-gray-700">Operator Compatibility</h3>
                    <div>
                        <label for="supportedSoftware" class="block text-sm font-medium text-gray-600 mb-1">Supported Software</label>
                        <textarea id="supportedSoftware" class="w-full p-2 border border-gray-300 rounded-md h-24" placeholder="PS: 8.4.5-5&#10;XtraBackup-8.4: 8.4.0-3"></textarea>
                        <p class="text-xs text-gray-500 mt-1">One software per line, e.g., 'PS: 8.4.5-5'.</p>
                    </div>
                    <div>
                        <label for="supportedPlatforms" class="block text-sm font-medium text-gray-600 mb-1">Supported Platforms</label>
                        <textarea id="supportedPlatforms" class="w-full p-2 border border-gray-300 rounded-md h-24" placeholder="GKE: 1.31 - 1.33&#10;EKS: 1.31 - 1.33"></textarea>
                        <p class="text-xs text-gray-500 mt-1">One platform per line, e.g., 'GKE: 1.31 - 1.33'. Supported keys: GKE, EKS, Openshift, AKS, Minikube.</p>
                    </div>
                    <div>
                        <label for="certifiedImagesJsonUrl" class="block text-sm font-medium text-gray-600 mb-1">Certified Images JSON URL</label>
                        <input type="url" id="certifiedImagesJsonUrl" class="w-full p-2 border border-gray-300 rounded-md" placeholder="https://raw.githubusercontent.com/Percona-Lab/percona-version-service/refs/heads/main/sources/operator.2.6.0.pg-operator.json">
                    </div>
                    <div>
                        <label for="excludedImagesPatterns" class="block text-sm font-medium text-gray-600 mb-1">Excluded Images Patterns (comma-separated)</label>
                        <input type="text" id="excludedImagesPatterns" class="w-full p-2 border border-gray-300 rounded-md" placeholder="2.5.0, 2.6.0">
                    </div>
                    <div>
                        <label for="groupSortPatterns" class="block text-sm font-medium text-gray-600 mb-1">Group Sort Patterns (comma-separated)</label>
                        <input type="text" id="groupSortPatterns" class="w-full p-2 border border-gray-300 rounded-md" placeholder="postgres$,postgres-gis,pgbouncer,pgbackrest">
                    </div>
                </div>
                <div class="flex justify-end space-x-4">
                    <a href="/" class="bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded-lg hover:bg-gray-300">Cancel</a>
                    <button type="submit" class="bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700">Save Release</button>
                </div>
            </form>
        </div>
    </template>

    <template id="release-details-template">
        <div data-page="release-details">
            <div class="bg-white rounded-xl shadow-lg p-6 md:p-8">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h1 class="text-3xl font-bold" id="details-version"></h1>
                        <p class="text-gray-500" id="details-project-date"></p>
                    </div>
                    <div class="flex space-x-2">
                        <a href="#" id="edit-release-btn" class="bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded-lg hover:bg-gray-300">Edit</a>
                        <button id="generate-btn" class="bg-green-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-green-700 flex items-center">
                            <span id="generate-btn-text">Generate</span>
                            <div id="generate-spinner" class="spinner hidden ml-2"></div>
                        </button>
                    </div>
                </div>
                <div id="result-container" class="hidden mt-8 border-t pt-6">
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex border-b">
                            <div id="tab-markdown" class="tab-btn active">Markdown</div>
                            <div id="tab-preview" class="tab-btn">Preview</div>
                        </div>
                        <button id="copy-btn" class="bg-gray-200 text-gray-800 font-semibold py-2 px-4 rounded-lg hover:bg-gray-300">Copy</button>
                    </div>
                    <pre id="result-output" class="bg-gray-100 p-4 rounded-lg border"></pre>
                    <div id="result-preview" class="prose max-w-none p-4 hidden"></div>
                </div>
            </div>
        </div>
    </template>

    <script src="/static/js/release.js"></script>
</body>
</html>
